name: CI

on:
  push:
    branches: [ main, master, '007-bottom-navigation-bar' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Unit Tests & Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 3.38.5
          cache: true

      - name: Install dependencies (Root)
        run: flutter pub get

      - name: Run build_runner (Root)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      # - name: Analyze (Root)
      #   run: flutter analyze

      - name: Run tests (Root)
        run: flutter test

      - name: Install dependencies (bible_handler)
        working-directory: packages/bible_handler
        run: flutter pub get

      - name: Analyze (bible_handler)
        working-directory: packages/bible_handler
        run: flutter analyze

      - name: Run tests (bible_handler)
        working-directory: packages/bible_handler
        run: flutter test

  build:
    name: Build APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 3.38.5
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: flutter build apk --release

      - name: Setup Firebase CLI
        if: github.ref == 'refs/heads/main'
        run: npm install -g firebase-tools

      - name: Distribute to Firebase
        if: github.ref == 'refs/heads/main'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          ./scripts/distribute-apk.sh --release-notes "CI Build: ${{ github.sha }}" --groups "testers"
