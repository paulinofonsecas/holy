workflows:

  # ==========================================================
  # 1️⃣ Workflow para Pull Request (Somente Testes)
  # ==========================================================
  pr-validation:
    name: PR Validation
    instance_type: mac_mini_m1
    max_build_duration: 30

    environment:
      flutter: 3.38.5

    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true

    scripts:
      - name: Get dependencies
        script: flutter pub get

      - name: Run tests
        script: flutter test --coverage

    artifacts:
      - coverage/lcov.info


  # ==========================================================
  # 2️⃣ Workflow Release (TAG → Deploy para Stores)
  # ==========================================================
  release-build:
    name: Release Build & Deploy
    instance_type: mac_mini_m1
    max_build_duration: 60

    environment:
      groups:
        - google_play
        - app_store
      flutter: stable
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - ~/.gradle/caches
        - ~/.cocoapods

    scripts:

      # ------------------------------------------------------
      # Ler versão do pubspec.yaml (robusto)
      # ------------------------------------------------------
      - name: Read version from pubspec.yaml
        script: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml)
          FULL_VERSION=$(echo $VERSION_LINE | sed 's/version: //')

          if [[ $FULL_VERSION == *"+"* ]]; then
            VERSION_NAME=$(echo $FULL_VERSION | cut -d'+' -f1)
            VERSION_CODE=$(echo $FULL_VERSION | cut -d'+' -f2)
          else
            echo "Erro: versão precisa conter build number (ex: 1.0.0+1)"
            exit 1
          fi

          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "Build number inválido"
            exit 1
          fi

          echo "APP_VERSION=$VERSION_NAME" >> $CM_ENV
          echo "APP_BUILD_NUMBER=$VERSION_CODE" >> $CM_ENV

          echo "Versão: $VERSION_NAME"
          echo "Build: $VERSION_CODE"

      # ------------------------------------------------------
      # Dependências
      # ------------------------------------------------------
      - name: Get dependencies
        script: flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      - name: Run tests
        script: flutter test

      # ------------------------------------------------------
      # Android Signing
      # ------------------------------------------------------
      - name: Configure Android signing
        script: |
          echo $CM_KEYSTORE | base64 --decode > /tmp/keystore.keystore

          cat >> "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_ALIAS_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=/tmp/keystore.keystore
          EOF

      # ------------------------------------------------------
      # Build Android
      # ------------------------------------------------------
      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release \
            --build-name=$APP_VERSION \
            --build-number=$APP_BUILD_NUMBER

      # ------------------------------------------------------
      # iOS Signing
      # ------------------------------------------------------
      - name: Configure iOS signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      # ------------------------------------------------------
      # Build iOS
      # ------------------------------------------------------
      - name: Build iOS IPA
        script: |

          flutter build ipa --release \
            --build-name=$APP_VERSION \
            --build-number=$APP_BUILD_NUMBER

    artifacts:
      - build/**/outputs/**/*.aab
      - build/ios/ipa/*.ipa

    publishing:

      # 🔵 Android → Google Play
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: production
        submit_as_draft: false

      # 🍎 iOS → TestFlight
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false

      email:
        recipients:
          - paulino.fonseca@bitkabir.com