# ==========================================================
# Workflow Unificado Release (PUSH → Android + iOS)
#         1. Android (AAB → Play Store)
#         2. iOS     (IPA → TestFlight)
# ==========================================================
workflows:
  release-build:
    name: Release Build & Deploy (Android + iOS)
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: "martins"

    environment:
      groups:
        - ios_signing
      #   - google_play_credentials
      #   - keystore_credentials
      
      # ios_signing:
      #   distribution_type: app_store
      #   bundle_identifier: "com.paulinofonseca.eusou"
        
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        PACKAGE_NAME: "com.paulinofonseca.eusou"
        BUNDLE_ID: "com.paulinofonseca.eusou"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "main"
          include: true
      cancel_previous_builds: true
    
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - ios/Pods

    scripts:
      # ----------------------------------------------------------
      # Shared
      # ----------------------------------------------------------
      - name: Read version from pubspec.yaml
        script: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml)
          FULL_VERSION=$(echo $VERSION_LINE | sed 's/version: //')
          if [[ $FULL_VERSION == *"+"* ]]; then
            VERSION_NAME=$(echo $FULL_VERSION | cut -d'+' -f1)
            VERSION_CODE=$(echo $FULL_VERSION | cut -d'+' -f2)
          else
            echo "Erro: versão precisa conter build number (ex: 1.0.0+1)"
            exit 1
          fi
          echo "APP_VERSION=$VERSION_NAME" >> $CM_ENV
          echo "APP_BUILD_NUMBER=$VERSION_CODE" >> $CM_ENV

      - name: Get dependencies
        script: flutter pub get

      # ----------------------------------------------------------
      # Android
      # ----------------------------------------------------------
      # - name: "[Android] Configurar Keystore e key.properties"
      #   script: |
      #     echo $CM_KEYSTORE_BASE64 | base64 --decode > /tmp/keystore.keystore

      #     cat >> "$CM_BUILD_DIR/android/key.properties" <<EOF
      #     storePassword=$CM_STORE_PASSWORD
      #     keyPassword=$CM_KEY_PASSWORD
      #     keyAlias=$CM_KEY_ALIAS
      #     storeFile=/tmp/keystore.keystore
      #     EOF

      # - name: "[Android] Build App Bundle (AAB)"
      #   script: |
      #     flutter build appbundle --release \
      #       --build-name=$APP_VERSION \
      #       --build-number=$APP_BUILD_NUMBER

      # ----------------------------------------------------------
      # iOS
      # ----------------------------------------------------------
      - name: "[iOS] Install CocoaPods"
        script: |
          cd ios
          pod install
          cd ..

      - name: "[iOS] Configurar Keychain e Certificados"
        script: |
          keychain add-certificates

      - name: "[iOS] Configurar Provisioning Profiles"
        script: |
          xcode-project use-profiles

      - name: "[iOS] Build IPA"
        script: |
          flutter build ipa --release \
            --build-name=$APP_VERSION \
            --build-number=$APP_BUILD_NUMBER \
            --export-options-plist=$HOME/export_options.plist

    artifacts:
      # - build/app/outputs/bundle/release/app-release.aab
      # - build/app/outputs/mapping/release/mapping.txt
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
      #   submit_as_draft: true

      app_store_connect:
        auth: integration
        submit_to_testflight: true

      email:
        recipients:
          - paulinofonsecass@gmail.com