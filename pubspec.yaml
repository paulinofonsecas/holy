name: eu_sou
description: A Flutter project was generated by Bunny CLI.
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.3.0+37

environment:
  sdk: ^3.6.0
  flutter: ">=3.38.4"
dependencies:
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  bible_handler:
    path: packages/bible_handler

  # Firebase dependencies for push notifications
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0
  app_links: ^6.3.2
  firebase_crashlytics: ^5.0.6
  firebase_storage: ^13.0.5
  flutter_local_notifications: ^20.1.0

  # Core packages
  cupertino_icons: ^1.0.6
  intl: any
  equatable: ^2.0.5
  path_provider: ^2.1.1
  shared_preferences: ^2.5.2
  flutter_secure_storage: ^10.0.0
  cached_network_image: ^3.3.0
  url_launcher: ^6.1.14
  package_info_plus: ^9.0.0
  device_info_plus: ^12.3.0
  feedback: ^3.1.0

  # Gemini AI
  google_generative_ai: ^0.4.5
  objectbox: 5.2.0
  objectbox_flutter_libs: 5.2.0

  flutter_svg: ^2.0.9
  flutter_dotenv: ^6.0.0
  json_annotation: ^4.8.1
  freezed_annotation: ^3.1.0
  shimmer: ^3.0.0
  dio: ^5.3.3
  logger: ^2.0.2
  archive: ^4.0.7
  # BLoC state management
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  hydrated_bloc: ^10.1.1
  stream_transform: ^2.1.0
  # MVVM Architecture dependencies
  stacked: ^3.4.1
  stacked_services: ^1.3.0
  gap: ^3.0.1
  sqflite: ^2.3.0
  # Web persistence (IndexedDB) via sembast
  sembast: ^3.8.0
  sembast_web: ^2.4.0
  path: ^1.9.0
  share_plus: ^10.1.4
  image_picker: ^1.0.7
  gal: ^2.3.2
  # net_bible_service:
  #   path: "../../dart/my_packages/net_bible_service"
  flutter_smartdio: ^1.0.4
  wolt_modal_sheet: ^0.11.0
  sqlite3: ^2.9.4
  timezone: ^0.10.0
  flutter_timezone: ^5.0.1
  sqflite_common_ffi: ^2.3.7+1
  sqflite_common_ffi_web: ^1.0.2
  firebase_core_web: ^3.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  tutorial_coach_mark: ^1.3.3
  pdf: ^3.11.3
  printing: ^5.14.2
  google_fonts: ^8.0.2
  flutter_markdown: ^0.7.7+1
  convex_bottom_bar: ^3.2.0
  smooth_page_indicator: ^2.0.1
  internet_connection_checker: ^3.0.1
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.6
  objectbox_generator: 5.2.0
  flutter_gen_runner: ^5.12.0
  flutter_launcher_icons: ^0.14.4
  source_gen: 4.2.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter


  json_serializable: ^6.7.1
  freezed: ^3.2.3

dependency_overrides:
  connectivity_plus: ^7.0.0
  # bloc_test: ^8.5.0

# Flutter configuration
flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/images/backgrounds/
    - assets/icons/
    - assets/icon/

  fonts:
    - family: TASAOrbiter
      fonts:
        - asset: assets/fonts/TASAOrbiter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/TASAOrbiter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/TASAOrbiter-Regular.ttf
          weight: 400
        - asset: assets/fonts/TASAOrbiter-Medium.ttf
          weight: 500
        - asset: assets/fonts/TASAOrbiter-Bold.ttf
          weight: 700
